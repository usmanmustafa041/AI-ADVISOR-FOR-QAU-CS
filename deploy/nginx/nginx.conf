upstream qau_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nginx itself is the public health endpoint.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # Never cache API responses containing academic or student data.
    location /api/ {
        proxy_pass http://qau_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        add_header Cache-Control 'no-store' always;
    }

    # FastAPI OpenAPI docs remain available through the same origin.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://qau_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router / SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control 'public, max-age=604800, immutable';
        add_header X-Content-Type-Options nosniff always;
    }

    client_max_body_size 10m;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}

