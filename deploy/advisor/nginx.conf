# TLS terminator for the portal + chatbot engine behind one host name.
#   /advisor/*  -> chatbot engine (the prefix is stripped)   streaming answers need buffering OFF
#   /api/*      -> portal API (accounts, study plan, fees ...)
#   /           -> portal interface (the built frontend/dist)
upstream advisor_engine { server 127.0.0.1:8010; keepalive 16; }
upstream portal_api     { server 127.0.0.1:8001; }

server {
    listen 443 ssl http2;
    server_name advisor.example.edu.pk;
    # ssl_certificate / ssl_certificate_key ...

    client_max_body_size 25m;        # department documents uploaded in the admin console

    location = /advisor/api/v1/chat/stream {
        proxy_pass http://advisor_engine/api/v1/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;          # Server-Sent Events
        proxy_cache off;
        proxy_read_timeout 180s;
    }
    location /advisor/ {
        proxy_pass http://advisor_engine/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;      # knowledge rebuilds started from the admin console
    }
    location /api/ {
        proxy_pass http://portal_api;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
    location / {
        root /var/www/qau-portal;     # frontend/dist
        try_files $uri /index.html;
    }
}
